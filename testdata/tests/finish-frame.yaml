  redundant_pic_cnt_present_flag: 0
  weighted_bipred_idc: 0 # average
  weighted_pred_flag: 0 # average
- first_mb_in_slice: 0
  frame_num: {absolute: 0, bits: 4}
  idr_pic_id: 0
  long_term_reference_flag: 0
  macroblocks_cavlc:
    - coded_block_pattern: 0
      intra_chroma_pred_mode: 0
      mb_type: 0
