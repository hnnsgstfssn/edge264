  nal_ref_idc: 1
  nal_unit_type: 5 # Coded slice of an IDR picture
  no_output_of_prior_pics_flag: 0
  pic_order_cnt: {absolute: 0, bits: 4, type: 0}
  pic_parameter_set_id: 0
  slice_qp_delta: 0
  slice_type: 2 # I
# changing pic_parameter_set_id (ignored)
